[project]
name = "cortical-circuit"
version = "0.1.0"
description = "Computational neuroscience cortical circuit simulation"
requires-python = ">=3.10"

# Runtime dependencies
dependencies = [
    # Core simulation dependencies
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<2.0",
    "dash>=2.18,<3.0",
    "dash-bootstrap-components>=1.7,<2.0",
    "plotly>=6.0,<7.0",
    "Flask>=3.0,<4.0",
    # Analysis dependencies
    "matplotlib>=3.5,<4.0",
    "tqdm>=4.60,<6.0",
    "pandas>=2.2,<3.0",
    "seaborn>=0.11,<1.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
]
test = [
    "pytest>=7.0,<8.0",
    "pytest-cov>=4.0,<5.0",
]

# ============================================================================
# Black (code formatter)
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | dev_env
  | __pycache__
  | outputs
  | results
)/
'''

# ============================================================================
# Ruff (linter)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"

# Exclude generated/external directories
exclude = [
    ".git",
    ".venv",
    "dev_env",
    "__pycache__",
    "outputs",
    "results",
]

[tool.ruff.lint]
# Start with safe, high-value rules; expand gradually
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports, undefined names)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common bugs)
    "SIM",    # flake8-simplify (simplifiable code)
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # line too long (Black handles this)
    "E722",   # bare except (fix incrementally)
    "E741",   # ambiguous variable name (l is common in scientific code)
    "B007",   # unused loop control variable (often intentional in range-based loops)
    "B008",   # function call in default argument (common in research code)
    "B904",   # raise without from in except (fix incrementally)
    "SIM108", # use ternary operator (readability varies)
    "RUF001", # ambiguous unicode in strings (Greek letters σ, τ, μ for scientific display)
    "RUF002", # ambiguous unicode in docstrings (math symbols ×, ∈ for documentation)
    "RUF003", # ambiguous unicode in comments (Greek letters for scientific comments)
    "RUF012", # mutable class attributes without ClassVar (common in Dash apps)
    "RUF013", # implicit Optional (common pattern in research code; fix incrementally)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Tests can have unused imports for fixtures, magic values, etc.
"tests/**/*.py" = ["F401", "F811"]

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

